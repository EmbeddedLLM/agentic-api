            ---


            ## Job 1: Python CSV Module — How It Reads CSV Rows


            Based on the [official Python documentation](https://docs.python.org/3/library/csv.html),
            here''s how the csv module reads CSV rows:


            **Key Reading Functions and Classes:**


            1. **`csv.reader(csvfile, dialect=''excel'', **fmtparams)`** — Returns
            a reader object that iterates over lines in the given csvfile. Each row
            is returned as a **list of strings** (no automatic type conversion unless
            `QUOTE_NONNUMERIC` is specified). The reader is an iterator, so you loop
            through rows with a `for` statement.


            2. **`csv.DictReader(csvfile, fieldnames=None, restkey=None, restval=None,
            dialect=''excel'', **fmtparams)`** — Operates like a regular reader but
            maps each row into a **dict** with keys from `fieldnames`. If `fieldnames`
            is omitted, the first row of the CSV file is used as the field names.


            **Important Notes:**

            - File objects should be opened with `newline=''''` so the csv module
            can handle newlines correctly.

            - An optional `dialect` parameter lets you customize delimiter, quoting,
            and other formatting rules (e.g., `''excel''`, `''excel-tab''`).

            - The reader is lazy — it reads one row at a time, which is memory-efficient
            for large files.


            ---


            ## Job 2: Tiktoken — Encoding Text into Tokens and Decoding Tokens Back
            into Text


            From the [openai/tiktoken](https://github.com/openai/tiktoken) documentation,
            here''s how tiktoken handles encoding and decoding:


            **Encoding Text into Tokens:**

            - **Method**: `enc.encode("text")` takes a string and returns a list of
            integer token IDs.

            - **Getting an Encoding**: Use `tiktoken.get_encoding("o200k_base")` to
            load an encoding by name, or `tiktoken.encoding_for_model("gpt-4o")` to
            get the encoding for a specific OpenAI model.

            - **Algorithm**: tiktoken uses **Byte Pair Encoding (BPE)**, which converts
            text into a sequence of numbers (tokens) by splitting text into common
            subwords (e.g., "encoding" → "encod" + "ing").


            **Decoding Tokens Back into Text:**

            - **Method**: `enc.decode([token_ids])` takes a list of integer token
            IDs and returns the original text string.

            - **Reversibility**: The process is **fully reversible and lossless**.
            Example: `assert enc.decode(enc.encode("hello world")) == "hello world"`


            **Key Properties of BPE in tiktoken:**

            1. **Reversible and lossless** — tokens can always be decoded back to
            the original text.

            2. **Works on arbitrary text** — even text not seen during the tokenizer''s
            training data.

            3. **Compresses text** — about ~4 bytes per token on average.

            4. **Common subword splitting** — helps models generalize by reusing tokens
            like "ing" across contexts.


