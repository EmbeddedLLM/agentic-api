          text: "\n\n# Python CSV Module - How It Reads CSV Rows\n\nBased on the [official\
            \ Python documentation](https://docs.python.org/3/library/csv.html), here's\
            \ how the csv module reads CSV rows:\n\n## Key Reading Functions and Classes\n\
            \n1. **`csv.reader(csvfile, dialect='excel', **fmtparams)`**\n   - Returns\
            \ a **reader object** that iterates over lines in the given csvfile\n\
            \   - The csvfile can be any object supporting the iterator protocol (e.g.,\
            \ file objects, strings)\n   - Each row is returned as a **list of strings**\
            \ — no automatic type conversion unless `QUOTE_NONNUMERIC` is specified\n\
            \   - The reader is an iterator, so you loop through rows with a `for`\
            \ statement\n\n2. **`csv.DictReader(csvfile, fieldnames=None, restkey=None,\
            \ restval=None, dialect='excel', **fmtparams)`**\n   - Operates like a\
            \ regular reader but maps information into a **dict** with keys from `fieldnames`\n\
            \   - If `fieldnames` is omitted, the first row of the CSV file is used\
            \ as the field names\n   - Each row is returned as an `OrderedDict` instead\
            \ of a list\n\n## Usage Pattern\n\n```python\nimport csv\n\nwith open('data.csv',\
            \ newline='') as csvfile:\n    reader = csv.reader(csvfile)  # or csv.DictReader(csvfile)\n\
            \    for row in reader:\n        # row is a list of strings (or dict for\
            \ DictReader)\n        print(row)\n```\n\n## Important Notes\n\n- **File\
            \ Opening**: File objects should be opened with `newline=''` so the csv\
            \ module can handle newlines correctly (embedded in quoted fields, platform-specific\
            \ `\\r\\n` endings)\n- **Dialect**: An optional `dialect` parameter lets\
            \ you customize delimiter, quoting, and other formatting rules (e.g.,\
            \ `'excel'`, `'excel-tab'`, `'unix'`)\n- **Lazy Iteration**: The reader\
            \ is lazy — it reads one row at a time from the underlying iterator, which\
            \ is memory-efficient for large files\n- **Source**: [Python 3.11 Documentation\
            \ – csv](https://docs.python.org/3/library/csv.html)"
