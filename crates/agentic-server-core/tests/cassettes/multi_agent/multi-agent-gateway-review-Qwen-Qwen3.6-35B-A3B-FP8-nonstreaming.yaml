        content:
        - annotations: []
          text: '


            ## Test Review Findings for `cache.py`


            ### Existing Test Coverage


            The **only existing test** loads one valid pickle payload for one user
            and verifies the return value. It exercises exactly one code path:


            ```

            Line 4: `user_id not in CACHE` → True  (first lookup)

            Line 5: `pickle.loads(payload)` → success (valid payload)

            Line 6: return `CACHE[user_id]` → success

            ```


            **Everything else is untested.**


            ---


            ### Missing Test Categories


            | # | Category | Test Count | Priority | Gap Severity |

            |---|----------|-----------|----------|-------------|

            | 1 | **Security — Pickle Deserialization** | 4 | **P0 (Immediate)** |
            RCE via crafted `__reduce__` payloads on line 5 |

            | 2 | **Mutation — Returned Mutable Reference** | 4 | **P0 (Immediate)**
            | Caller corrupts shared state; all subsequent callers see tampered data
            from line 6 |

            | 3 | **Input Validation — Type & Size** | 4 | **P1 (High)** | `pickle.loads`
            crashes on None, empty bytes, or oversized payloads (lines 3–5) |

            | 4 | **Concurrency — Race Conditions** | 4 | **P1 (High)** | Global `CACHE`
            accessed with no locks; simultaneous cache misses, interleaved reads/writes
            (lines 4–6) |

            | 5 | **Memory / DoS** | 4 | **P2 (Medium)** | Unbounded cache growth,
            pickle bomb inflation (lines 2, 5) |

            | 6 | **Cache Semantics — Stale Data** | 2 | **P2 (Medium)** | Re-fetching
            for the same user ignores the new payload (line 4) |

            | 7 | **Boundary / Edge Cases** | 4 | **P3 (Low)** | Empty user_id, None
            payload, non-hashable keys (lines 4–5) |


            **Total missing tests: ~26 concrete test cases across 7 categories.**


            ---


            ### Concrete Proposed Test Cases (Prioritized)


            #### P0 — Must Fix Before Deployment


            **Security — Pickle RCE (critical)**


            | # | Description | Code Path | Expected |

            |---|-------------|-----------|----------|

            | S1 | Craft a pickle payload with `__reduce__` that calls `os.system("echo
            hacked")` during unpickling | Line 5: `pickle.loads(payload)` | Must NOT
            execute system commands. Should be rejected at the serialization format
            boundary. |

            | S2 | Craft a pickle bomb (nested objects that inflate to GBs when deserialized)
            | Line 5: `pickle.loads(payload)` | Must raise within a bounded time.
            Requires `max_unpickle_depth` / recursion limit enforcement. |

            | S3 | Malformed / truncated pickle bytes | Line 5: `pickle.loads(payload)`
            | Should raise `pickle.UnpicklingError` or `EOFError`, not crash the process.
            |


            **Mutation — Shared Mutable State (critical)**


            | # | Description | Code Path | Expected |

            |---|-------------|-----------|----------|

            | M1 | `profile = load_profile("alice", payload); profile["role"] = "admin"`;
            call again for `"alice"` | Line 6: returns same dict reference; caller
            mutates; next call returns same object | Second caller sees `"admin"`.
            **Bug** — `copy.deepcopy` of the return value is required. |

            | M2 | Nested mutation: `profile["settings"]["theme"] = "dark"` on returned
            value | Line 6 | Must not affect other callers. Needs deep copy. |

            | M3 | `del profile["session_id"]` on the returned reference | Line 6
            | Key should persist in `CACHE` after deletion; test should verify it
            exists on a fresh call. |


            #### P1 — High Priority


            **Input Validation**


            | # | Description | Code Path | Expected |

            |---|-------------|-----------|----------|

            | V1 | `load_profile("alice", None)` | Line 5: `pickle.loads(None)` |
            Should raise `TypeError`. Test verifies type check exists before line
            5. |

            | V2 | `load_profile("alice", b"")` | Line 5: `pickle.loads(b"")` | Should
            raise `pickle.UnpicklingError`. |

            | V3 | `load_profile("alice", "not-bytes")` | Line 5 | Should raise `TypeError`.
            |

            | V4 | 100MB+ payload as `payload` | Line 5 | Should be rejected by a
            `max_payload_size` check before deserialization. |


            **Concurrency**


            | # | Description | Code Path | Expected |

            |---|-------------|-----------|----------|

            | C1 | Two threads simultaneously call `load_profile("alice", payload)`
            | Lines 4–5: both check `not in CACHE` before either writes | At most
            one deserialization should occur. Test verifies with `threading.Lock`
            that concurrent calls are serialized. |

            | C2 | One thread reads profile while another (via its own call to `load_profile`)
            mutates the dict | Line 6: return value is read by thread A while caller
            of thread B mutates it | Must not see torn state. Requires deep copy of
            return value. |

            | C3 | 1000 threads, each with unique user_ids, simultaneously insert
            | Lines 4–5: 1000 `CACHE[user_id] = ...` assignments | Should complete
            without `KeyError` or data loss. |


            **Cache Behavior**


            | # | Description | Code Path | Expected |

            |---|-------------|-----------|----------|

            | CB1 | `load_profile("alice", payload_a)` then `load_profile("bob", payload_b)`
            | Lines 4–5: cache miss for both | Two independent entries. Test verifies
            isolation. |

            | CB2 | `load_profile("alice", payload_a)` then `load_profile("alice",
            payload_b)` where payloads differ | Line 4: cache hit → skips deserialization
            | Returns the **first** payload''s value. Test documents this staleness
            behavior (may be intentional or a bug). |


            #### P2 — Medium Priority


            **Memory / DoS**


            | # | Description | Code Path | Expected |

            |---|-------------|-----------|----------|

            | D1 | 100,000 unique user_ids inserted into CACHE | Lines 2, 4–5: `CACHE[user_id]
            = ...` | Test documents unbounded growth; should assert a cache eviction
            policy (LRU/TTL) exists. |

            | D2 | 500MB pickle payload for a single user | Line 5: `pickle.loads(500MB)`
            | Should trigger `MemoryError` or a pre-check rejection. |

            | D3 | Cache never evicts: insert 10 users, wait, verify all 10 still
            present | Lines 4–6 over time | Documents that CACHE is immortal — a memory
            leak for long-running servers. |


            **Cache Semantics**


            | # | Description | Code Path | Expected |

            |---|-------------|-----------|----------|

            | CS1 | Verify that a malicious payload for `"admin"` persists in cache
            and corrupts subsequent reads | Lines 4–5 | Documents cache poisoning
            risk; there is no invalidation mechanism. |


            #### P3 — Low Priority (Robustness)


            **Boundary / Edge Cases**


            | # | Description | Code Path | Expected |

            |---|-------------|-----------|----------|

            | E1 | `load_profile("", valid_payload)` | Line 4 | Accepted as a valid
            key (documented behavior). |

            | E2 | `load_profile("alice", None)` → `TypeError` | Line 5 | Input validation
            catches it. |

            | E3 | `user_id` = `["not", "hashable"]` | Line 4: `"not hashable" not
            in CACHE` | Should raise `TypeError` for unhashable key. |

            | E4 | `user_id` = `"a" * 100000` | Line 4–5 | Accepted but documents
            potential DoS via huge cache keys. |


            ---


            ### Test Suite Structure Recommendation


            ```

            tests/test_cache.py


            TestPickleSecurity       — S1, S2, S3, V1, V2, V3, V4, D2 (4 tests)

            TestMutationSafety       — M1, M2, M3 (3 tests)

            TestCacheCorrectness     — CB1, CB2, CS1, E1, E3 (5 tests)

            TestConcurrency          — C1, C2, C3 (3 tests)

            TestMemoryDoS            — D1, D2, D3, S2 (4 tests)

            TestBoundaryEdgeCases    — E1, E2, E4 (3 tests)


            Total: ~22–26 concrete test cases

            ```


            ---


            ### Three Pre-Requisite Code Fixes (Without Which Tests Are Meaningless)


            1. **Replace `pickle.loads`** with `json.loads` or a restricted `SafeUnpickler`.
            This eliminates the entire S1–S3 family of RCE tests.

            2. **Return a deep copy** on line 6: `return copy.deepcopy(CACHE[user_id])`.
            This eliminates M1–M3 mutation bugs.

            3. **Add input validation** before line 5: `if not isinstance(payload,
            bytes): raise TypeError` and `if len(payload) > MAX_SIZE: raise ValueError`.
            This eliminates V1–V4 crash vectors.


            Once these three fixes are applied, the test suite shifts from covering
            critical vulnerabilities to verifying correct behavior under mutation,
            concurrency, and cache management — which is the appropriate scope for
            a well-hardened system.'
