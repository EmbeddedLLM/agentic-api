apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-api
  labels:
    app.kubernetes.io/name: agentic-api
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: agentic-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 960
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-api
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-api
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: agentic-api
    spec:
      serviceAccountName: agentic-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: agentic-api
                    app.kubernetes.io/component: gateway
      containers:
        - name: agentic-api
          image: agentic-api:dev
          imagePullPolicy: IfNotPresent
          args:
            - --llm-ready-timeout-s
            - "300"
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: agentic-api
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agentic-api
                  key: DATABASE_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agentic-api
                  key: OPENAI_API_KEY
                  optional: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 132
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
