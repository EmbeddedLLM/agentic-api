[package]
name = "agentic-api"
version = "0.1.0"
edition = "2024"
description = "Stateful API logic for agentic applications using vLLM"
license = "Apache-2.0"
repository = "https://github.com/vllm-project/agentic-api"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
bytes = { version = "1.5", features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
async-stream = "0.3"
either = "1"
http = "1"
reqwest = { version = "0.12", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "sqlite", "postgres", "json", "chrono", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7"] }
validator = { version = "0.19", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-stream = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Release build optimizations for maximum performance
[profile.release]
opt-level = 3                # Maximum optimization
lto = true                   # Enable Link Time Optimization
codegen-units = 1           # Better optimization (slower compile)
strip = true                # Strip symbols for smaller binary
panic = "abort"             # Faster panic handling

# For development, balance speed and compile time
[profile.dev]
split-debuginfo = "packed"  # Faster debug builds
